<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Défi OneNote × Pôle Premium</title>
<meta name="theme-color" content="#7719AA">
<meta property="og:title" content="Le Défi OneNote × Pôle Premium">
<meta property="og:description" content="Formation OneNote pour Directeurs Régionaux — structurez vos visites magasin en équipe.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='5' fill='%237719AA'/%3E%3Crect x='6' y='7' width='10' height='1.8' rx='0.9' fill='white'/%3E%3Crect x='6' y='11' width='10' height='1.8' rx='0.9' fill='white'/%3E%3Crect x='6' y='15' width='7' height='1.8' rx='0.9' fill='white'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%237719AA'/%3E%3Crect x='6' y='7' width='10' height='1.8' rx='0.9' fill='white'/%3E%3Crect x='6' y='11' width='10' height='1.8' rx='0.9' fill='white'/%3E%3Crect x='6' y='15' width='7' height='1.8' rx='0.9' fill='white'/%3E%3C/svg%3E">
<style>
  :root{
    --purple:#7719AA;
    --ink:#1D1D1F;
    --ink-soft:#6E6E73;
    --paper:#FBFBFD;
    --line:#E5E5E7;

    --c1:#7719AA;
    --c2:#038387;
    --c3:#CA5010;
    --c4:#107C10;
    --c5:#C239B3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- top progress ---------- */
  .top-progress{
    position:fixed; top:0; left:0; right:0; height:3px; z-index:100;
    background:transparent;
  }
  .top-progress-fill{
    height:100%; width:0%;
    background:var(--accent, var(--purple));
    transition:width .5s cubic-bezier(.22,1,.36,1), background .5s ease;
  }

  .score-chip{
    position:fixed; top:18px; right:20px; z-index:100;
    background:rgba(255,255,255,.7); backdrop-filter:blur(20px);
    border:1px solid rgba(0,0,0,.06);
    padding:8px 16px; border-radius:20px;
    font-size:13px; font-weight:600; color:var(--ink);
    box-shadow:0 4px 20px rgba(0,0,0,.05);
    display:flex; align-items:center; gap:6px;
    opacity:0; pointer-events:none;
    transition:opacity .5s ease;
  }
  .score-chip.show{ opacity:1; pointer-events:auto; }
  .score-chip b{ color:var(--accent, var(--purple)); transition:color .5s ease; }

  .brand-lockup{
    position:fixed; top:18px; left:20px; z-index:100;
    display:flex; align-items:center; gap:9px;
    background:rgba(255,255,255,.7); backdrop-filter:blur(20px);
    border:1px solid rgba(0,0,0,.06);
    padding:10px 18px; border-radius:20px;
    box-shadow:0 4px 20px rgba(0,0,0,.05);
  }
  .brand-lockup .on{ font-size:13.5px; font-weight:700; color:var(--purple); letter-spacing:-.01em; }
  .brand-lockup .x{ font-size:13px; font-weight:700; color:var(--ink-soft); }
  .brand-lockup .pp{ font-size:13.5px; font-weight:700; color:var(--ink); letter-spacing:-.01em; }

  /* ---------- slides ---------- */
  .stage{ position:relative; width:100%; height:100vh; overflow:hidden; }
  .slide{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:100px 8vw 150px;
    opacity:0; pointer-events:none;
    transform:translateY(26px) scale(.97);
    transition:opacity .65s cubic-bezier(.22,1,.36,1), transform .65s cubic-bezier(.22,1,.36,1);
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .slide.active{ opacity:1; pointer-events:auto; transform:translateY(0) scale(1); z-index:2; }
  .slide.prev{ transform:translateY(-26px) scale(.97); }

  .blob{
    position:absolute; inset:-10%;
    background:
      radial-gradient(600px 500px at 18% 15%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 60%),
      radial-gradient(700px 600px at 85% 80%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%);
    filter:blur(10px);
    z-index:0; pointer-events:none;
    transition:background 1s ease;
  }

  .slide-inner{ position:relative; z-index:1; max-width:720px; width:100%; text-align:center; }

  .eyebrow{
    font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--accent, var(--purple)); margin-bottom:18px;
    transition:color .5s ease;
  }
  .headline{
    font-size:clamp(30px,4.6vw,54px); font-weight:800; letter-spacing:-.02em; line-height:1.08;
    color:var(--ink); margin-bottom:18px;
  }
  .sub{ font-size:clamp(15px,1.6vw,19px); color:var(--ink-soft); font-weight:400; line-height:1.5; max-width:560px; margin:0 auto 8px; }

  .identity-form{
    margin:30px auto 0; display:flex; flex-wrap:wrap; justify-content:center; gap:12px; max-width:480px;
  }
  .identity-input{
    flex:1 1 190px; font-family:inherit; font-size:16px; padding:14px 20px;
    border:2px solid var(--line); border-radius:30px; background:#fff; color:var(--ink);
    outline:none; transition:border-color .2s ease; box-sizing:border-box;
  }
  .identity-input:focus{ border-color:var(--purple); }
  .identity-error{ margin-top:14px; font-size:13px; font-weight:600; color:#C0392B; }

  .bonus-pill{
    display:inline-block; margin-top:14px; font-size:12px; font-weight:700;
    color:#fff; background:var(--accent, var(--purple)); padding:5px 14px; border-radius:20px;
  }

  .pill-btn{
    border:none; cursor:pointer; font-family:inherit;
    border-radius:30px; padding:15px 30px; font-size:16px; font-weight:600;
    transition:transform .15s ease, box-shadow .15s ease, background .3s ease, color .3s ease;
  }
  .pill-btn:active{ transform:scale(.96); }

  .cta-start{ background:var(--ink); color:#fff; padding:16px 40px; font-size:17px; margin-top:30px; }
  .cta-start:hover{ box-shadow:0 8px 24px rgba(0,0,0,.18); }

  .feel-row{
    margin-top:36px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:14px;
  }
  .feel-btn{
    background:#fff; display:inline-flex; align-items:center; gap:10px;
    border:2px solid var(--line); color:var(--ink);
  }
  .feel-easy.on{ background:var(--accent, var(--purple)); border-color:var(--accent, var(--purple)); color:#fff; }
  .feel-unsure.on{ background:#FFF3D6; border-color:#E0A400; color:#8A5D00; }
  .feel-confused.on{ background:#F4F4F5; border-color:var(--line); color:var(--ink-soft); }
  .feel-btn.locked{ cursor:not-allowed; opacity:.75; pointer-events:none; }
  .locked-note{
    margin-top:10px; font-size:12px; font-weight:600; color:var(--ink-soft);
  }

  .extra-bonus{
    margin-top:16px; display:inline-flex; align-items:center; gap:10px;
    background:#fff; border:2px dashed #C98A00; color:#8A5D00;
    padding:12px 20px;
  }
  .extra-bonus .ic{ font-size:16px; }
  .extra-bonus.on{ background:#FFF6E0; border-style:solid; color:#8A5D00; }
  .extra-bonus.on .ic{ opacity:1; }

  .answer-card{
    margin:22px auto 0; max-width:560px;
    max-height:0; opacity:0; overflow:hidden;
    transition:max-height .5s cubic-bezier(.22,1,.36,1), opacity .4s ease, margin .5s ease, padding .5s ease;
    background:rgba(255,255,255,.75); backdrop-filter:blur(16px);
    border:1px solid rgba(0,0,0,.06);
    border-radius:20px;
    text-align:left;
    box-shadow:0 10px 40px rgba(0,0,0,.06);
  }
  .answer-card.open{ max-height:520px; opacity:1; padding:22px 26px; }
  .answer-card .lbl{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--accent, var(--purple)); margin-bottom:8px; }
  .answer-card .txt{ font-size:14.5px; line-height:1.6; color:var(--ink); }

  .synthesis-card{
    margin:30px auto 0; max-width:600px; text-align:left;
    background:rgba(255,255,255,.75); backdrop-filter:blur(16px);
    border:1px solid rgba(0,0,0,.06); border-radius:20px; padding:22px 26px;
    box-shadow:0 10px 40px rgba(0,0,0,.06);
  }
  .synthesis-head{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .synthesis-title{ font-size:15px; font-weight:700; color:var(--ink); }
  .synthesis-title span{ color:var(--purple); }
  .synthesis-dl{ padding:9px 16px; font-size:12.5px; background:#fff; border:2px solid var(--line); color:var(--ink); }
  .synthesis-dl:hover{ border-color:var(--purple); color:var(--purple); }
  .synthesis-empty{ font-size:14px; color:var(--ink-soft); padding:6px 0; }
  .synthesis-mission{ margin-bottom:16px; }
  .synthesis-mission:last-child{ margin-bottom:0; }
  .synthesis-mission-head{
    display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    color:#fff; background:var(--m); padding:4px 12px; border-radius:20px; margin-bottom:8px;
  }
  .synthesis-item{ display:flex; align-items:flex-start; gap:8px; font-size:13.5px; line-height:1.5; color:var(--ink); padding:5px 0; }
  .synthesis-item .tag{ flex:0 0 auto; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; white-space:nowrap; }
  .synthesis-item.lost .tag{ background:#FDEAEA; color:#C0392B; }
  .synthesis-item.unsure .tag{ background:#FFF3D6; color:#8A5D00; }

  /* mini visuals — reused, restyled to sit in the glass card */
  .viz{ margin-top:14px; padding:12px; background:#fff; border:1px solid var(--line); border-radius:12px; display:inline-block; }
  .viz-cap{ font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:6px; font-weight:700; }
  .viz-nb{ display:flex; align-items:center; gap:6px; font-size:11px; padding:4px 6px; border-radius:4px; min-width:150px; }
  .viz-nb .sq{ width:10px;height:10px;border-radius:2px; flex:0 0 auto; }
  .viz-nb.hl{ background:#F3E8FB; font-weight:700; color:var(--purple); }
  .viz-tab{ padding:4px 9px; border-radius:5px 5px 0 0; color:#fff; font-size:10.5px; font-weight:700; }
  .viz-pages{ border:1px solid var(--line); border-radius:6px; overflow:hidden; width:160px; }
  .viz-page{ padding:5px 8px; font-size:10.5px; border-bottom:1px solid #F0EDF2; color:var(--ink-soft); }
  .viz-page:last-child{border-bottom:none;}
  .viz-page.hl{ background:#F3E8FB; font-weight:700; color:var(--accent,var(--purple)); border-left:3px solid var(--accent,var(--purple)); }
  .viz-btn{ display:inline-flex; align-items:center; gap:5px; background:#fff; border:1.5px solid var(--accent,var(--purple)); color:var(--accent,var(--purple)); border-radius:16px; padding:4px 11px; font-size:11px; font-weight:700; }
  .viz-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .viz-sync{ display:flex; align-items:center; gap:7px; background:#F1FAF1; border:1px solid #BFE6BF; color:#1B6B1B; border-radius:6px; padding:6px 10px; font-size:10.5px; font-weight:600; }
  .viz-sync .dot{ width:8px;height:8px;border-radius:50%; background:#2FAE4E; flex:0 0 auto; }
  .viz-menu{ border:1px solid var(--line); border-radius:6px; overflow:hidden; width:190px; }
  .viz-menu-item{ padding:6px 10px; font-size:10.5px; border-bottom:1px solid #F0EDF2; color:var(--ink); }
  .viz-menu-item:last-child{border-bottom:none;}
  .viz-menu-item.hl{ background:var(--accent,var(--purple)); color:#fff; font-weight:700; }
  .viz-cursor{ display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--ink); background:#F5F0F8; padding:5px 10px; border-radius:6px; font-weight:600; }
  .viz-search{ display:flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:16px; padding:6px 12px; font-size:10.5px; color:var(--ink-soft); width:200px; }
  .viz-tmpl{ border:1px solid var(--line); border-radius:6px; padding:9px 11px; width:180px; }
  .viz-tmpl .l{ height:6px; background:#EDE6F1; border-radius:3px; margin:5px 0; }
  .viz-tmpl .l.title{ height:8px; width:55%; background:var(--accent,var(--purple)); opacity:.55; margin-bottom:8px; }
  .viz-phone{ width:70px; height:126px; border:2px solid var(--ink); border-radius:12px; padding:8px 6px 6px; background:#fff; position:relative; }
  .viz-phone .notch{ width:20px; height:3px; background:var(--ink); border-radius:2px; margin:0 auto 8px; }
  .viz-phone .app{ width:26px;height:26px;border-radius:8px; background:var(--purple); margin:0 auto; display:flex; align-items:center; justify-content:center; }
  .viz-phone .app svg{width:14px;height:14px;}
  .viz-phone .lbl2{ text-align:center; font-size:8px; color:var(--ink-soft); margin-top:5px; }
  .viz-phone .dot{ width:9px;height:9px;border-radius:50%; background:#2FAE4E; margin:9px auto 0; }
  .viz-phone .toolbar{ position:absolute; bottom:7px; left:6px; right:6px; display:flex; justify-content:space-around; }
  .viz-phone .tbtn{ width:20px;height:20px;border-radius:50%; background:var(--accent,var(--purple)); display:flex; align-items:center; justify-content:center; }
  .viz-phone .tbtn svg{width:11px;height:11px;}
  .viz-phone .cloud{ text-align:center; margin-top:12px; font-size:18px; color:#B0A6B8; }

  /* mission intro slide */
  .m-badge{
    width:76px; height:76px; border-radius:22px; margin:0 auto 26px;
    background:var(--accent, var(--purple)); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:30px; font-weight:800;
    box-shadow:0 14px 34px color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .m-meta{ margin-top:16px; font-size:14px; color:var(--ink-soft); font-weight:600; }

  /* final slide */
  .final-num{ font-size:clamp(60px,9vw,110px); font-weight:800; letter-spacing:-.03em; color:var(--accent,var(--purple)); }
  .final-ring{ width:150px; height:150px; margin:0 auto 30px; position:relative; }
  .final-ring svg{ transform:rotate(-90deg); }
  .final-ring circle{ fill:none; stroke-width:8; }
  .final-ring .bg{ stroke:var(--line); }
  .final-ring .fg{ stroke:var(--accent,var(--purple)); stroke-linecap:round; transition:stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1); }

  /* ---------- bottom nav ---------- */
  .bottom-nav{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:100;
    display:flex; align-items:center; gap:14px;
    background:rgba(255,255,255,.7); backdrop-filter:blur(20px);
    border:1px solid rgba(0,0,0,.06);
    padding:10px 14px; border-radius:40px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
  }
  .nav-arrow{
    width:40px; height:40px; border-radius:50%; border:none; cursor:pointer;
    background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center;
    transition:opacity .2s ease, transform .15s ease;
  }
  .nav-arrow:active{ transform:scale(.92); }
  .nav-arrow[disabled]{ opacity:.25; cursor:default; }
  .nav-arrow svg{ width:16px; height:16px; }
  .nav-frac{ font-size:12.5px; font-weight:700; color:var(--ink-soft); min-width:54px; text-align:center; }
  .nav-sep{ width:1px; height:22px; background:var(--line); margin:0 2px; }

  /* ---------- menu overlay ---------- */
  .menu-overlay{
    position:fixed; inset:0; z-index:200;
    background:rgba(20,10,25,.35); backdrop-filter:blur(6px);
    opacity:0; pointer-events:none;
    transition:opacity .35s ease;
  }
  .menu-overlay.open{ opacity:1; pointer-events:auto; }

  .menu-panel{
    position:absolute; top:0; right:0; bottom:0; width:min(400px, 88vw);
    background:rgba(251,251,253,.92); backdrop-filter:blur(24px);
    box-shadow:-20px 0 60px rgba(0,0,0,.18);
    display:flex; flex-direction:column;
    transform:translateX(100%);
    transition:transform .4s cubic-bezier(.22,1,.36,1);
  }
  .menu-overlay.open .menu-panel{ transform:translateX(0); }

  .menu-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 22px 16px; border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  .menu-title{ font-size:19px; font-weight:800; letter-spacing:-.01em; color:var(--ink); }
  .menu-close{
    width:32px; height:32px; border-radius:50%; border:none; cursor:pointer;
    background:var(--line); color:var(--ink); display:flex; align-items:center; justify-content:center;
  }
  .menu-close svg{ width:14px; height:14px; }

  .menu-list{ flex:1; overflow-y:auto; padding:8px 12px 24px; }

  .menu-mission{ margin-top:16px; }
  .menu-mission:first-child{ margin-top:6px; }
  .menu-mission-head{
    display:flex; align-items:center; gap:10px; padding:8px 10px;
    font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
    color:#fff; border-radius:8px;
  }
  .menu-mission-pts{ margin-left:auto; font-weight:700; opacity:.9; }

  .menu-step{
    display:flex; align-items:center; gap:10px;
    padding:10px 10px 10px 14px; border-radius:10px; cursor:pointer;
    font-size:13.5px; color:var(--ink); text-align:left;
    transition:background .15s ease;
  }
  .menu-step:hover{ background:rgba(0,0,0,.04); }
  .menu-step.current{ background:color-mix(in srgb, var(--mstep-color) 12%, transparent); font-weight:700; }
  .menu-step .num{
    width:22px; height:22px; border-radius:50%; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800;
    border:1.5px solid var(--line); color:var(--ink-soft);
  }
  .menu-step.done .num{ background:var(--mstep-color); border-color:var(--mstep-color); color:#fff; }
  .menu-step .num svg{ width:11px; height:11px; }
  .menu-step .lbl{ flex:1; line-height:1.35; }
  .menu-step.done .lbl{ color:var(--ink-soft); }
  .menu-step .badge{
    font-size:9.5px; font-weight:800; color:var(--mstep-color); border:1px solid var(--mstep-color);
    border-radius:10px; padding:1px 6px; flex:0 0 auto;
  }
  .menu-step .lock{ font-size:12px; flex:0 0 auto; }

  @media (max-width:640px){
    .slide{ padding:90px 7vw 120px; }
    .headline{ font-size:26px; }
    .score-chip{ font-size:11.5px; padding:6px 12px; }
    .brand-lockup{ padding:8px 14px; gap:7px; }
    .brand-lockup .pp, .brand-lockup .on{ font-size:11.5px; }
  }
</style>
</head>
<body>

<div class="top-progress"><div class="top-progress-fill" id="topFill"></div></div>
<div class="brand-lockup">
  <span class="on">OneNote</span>
  <span class="x">×</span>
  <span class="pp">Pôle Premium</span>
</div>
<div class="score-chip" id="scoreChip"><b id="scoreNum">0</b>/ <span id="scoreTotalLbl">100</span> points</div>

<div class="stage" id="stage"></div>

<div class="bottom-nav">
  <button class="nav-arrow" id="prevBtn" aria-label="Précédent">
    <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="nav-frac" id="navFrac">1 / 33</div>
  <button class="nav-arrow" id="nextBtn" aria-label="Suivant">
    <svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="nav-sep"></div>
  <button class="nav-arrow" id="menuBtn" aria-label="Toutes les étapes">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>
</div>

<div class="menu-overlay" id="menuOverlay">
  <div class="menu-panel">
    <div class="menu-head">
      <div class="menu-title">Toutes les étapes</div>
      <button class="menu-close" id="menuClose" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="menu-list" id="menuList"></div>
  </div>
</div>

<script>
/* ============== mini-visuels (repris et adaptés) ============== */
const ICONS = {
  plus: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>',
  pencil: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>',

  return t;
}

function wireQuestionSlide(idx){
  const slide = slides[idx];
  if(slide.type !== 'question') return;
  const { mi, ii } = slide;
  const easyBtn = document.getElementById(`easy-${mi}-${ii}`);
  const unsureBtn = document.getElementById(`unsure-${mi}-${ii}`);
  const confusedBtn = document.getElementById(`confused-${mi}-${ii}`);
  const ansBox = document.getElementById(`ans-${mi}-${ii}`);
  const lockNote = document.getElementById(`lock-${mi}-${ii}`);

  function applyLockVisuals(){
    const isLocked = revealed[mi][ii];
    easyBtn.disabled = isLocked;
    unsureBtn.disabled = isLocked;
    confusedBtn.disabled = isLocked;
    easyBtn.classList.toggle('on', status[mi][ii] === 'ok');
    unsureBtn.classList.toggle('on', status[mi][ii] === 'unsure');
    confusedBtn.classList.toggle('on', status[mi][ii] === 'lost');
    easyBtn.classList.toggle('locked', isLocked && status[mi][ii] !== 'ok');
    unsureBtn.classList.toggle('locked', isLocked && status[mi][ii] !== 'unsure');
    confusedBtn.classList.toggle('locked', isLocked && status[mi][ii] !== 'lost');
    lockNote.style.display = isLocked ? 'block' : 'none';
    lockNote.textContent = status[mi][ii] === 'lost' ? '🔒 Réponse consultée' : '🔒 Marqué comme à revoir';
  }

  applyLockVisuals();

  easyBtn.onclick = () => {
    if(revealed[mi][ii]) return; // verrouillé : une réponse a déjà été consultée
    status[mi][ii] = status[mi][ii] === 'ok' ? null : 'ok';
    state[mi][ii] = status[mi][ii] === 'ok';
    applyLockVisuals();
    updateScore();
  };

  unsureBtn.onclick = () => {
    if(revealed[mi][ii]) return;
    revealed[mi][ii] = true;
    status[mi][ii] = 'unsure';
    state[mi][ii] = false;
    applyLockVisuals();
    updateScore();
  };

  confusedBtn.onclick = () => {
    if(revealed[mi][ii]) return;
    revealed[mi][ii] = true;
    status[mi][ii] = 'lost';
    state[mi][ii] = false;
    applyLockVisuals();
    updateScore();
    ansBox.classList.add('open');
  };

  const bonusBtn = document.getElementById(`bonus-${mi}-${ii}`);
  if(bonusBtn){
    bonusBtn.classList.toggle('on', extraState[mi][ii]);
    bonusBtn.onclick = () => {
      extraState[mi][ii] = !extraState[mi][ii];
      bonusBtn.classList.toggle('on', extraState[mi][ii]);
      updateScore();
    };
  }
}

function computeSynthesis(){
  return MISSIONS.map((m, mi) => {
    const items = m.items
      .map((it, ii) => ({ text: it.t, st: status[mi][ii] }))
      .filter(x => x.st === 'unsure' || x.st === 'lost');
    const severity = items.reduce((s,x)=> s + (x.st === 'lost' ? 2 : 1), 0);
    return { mi, title: m.title, color: m.color, items, severity };
  }).filter(g => g.items.length > 0).sort((a,b) => b.severity - a.severity);
}

function renderSynthesis(){
  const nameEl = document.getElementById('synthName');
  const bodyEl = document.getElementById('synthesisBody');
  if(!nameEl || !bodyEl) return;
  const fullName = `${participantFirst} ${participantLast}`.trim();
  nameEl.textContent = fullName || '—';

  const groups = computeSynthesis();
  if(groups.length === 0){
    bodyEl.innerHTML = `<div class="synthesis-empty">🎉 Aucun sujet à retravailler pour l'instant — bravo !</div>`;
    return;
  }
  bodyEl.innerHTML = groups.map(g => `
    <div class="synthesis-mission">
      <div class="synthesis-mission-head" style="--m:${g.color}">${g.title}</div>
      ${g.items.map(it => `
        <div class="synthesis-item ${it.st}">
          <span class="tag">${it.st === 'lost' ? 'Priorité' : 'À revoir'}</span>
          <span class="txt">${it.text}</span>
        </div>`).join('')}
    </div>`).join('');
}

function downloadSynthesis(){
  const fullName = `${participantFirst} ${participantLast}`.trim() || 'Participant';
  const groups = computeSynthesis();
  const lines = [
    'Synthèse — Formation OneNote (Directeurs Régionaux)',
    `Participant : ${fullName}`,
    `Score : ${grandTotal()} / ${TOTAL_POINTS}`,
    ''
  ];
  if(groups.length === 0){
    lines.push('Aucun sujet à retravailler — tout est acquis.');
  } else {
    lines.push('Sujets à travailler (du plus urgent au moins urgent) :');
    groups.forEach(g => {
      lines.push('');
      lines.push(`— ${g.title} —`);
      g.items.forEach(it => lines.push(`  [${it.st === 'lost' ? 'Priorité' : 'À revoir'}] ${it.text}`));
    });
  }
  const blob = new Blob([lines.join('\n')], { type:'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Synthese_OneNote_${fullName.replace(/[^a-z0-9]+/gi,'_') || 'participant'}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function updateScore(){
  const g = grandTotal();
  scoreNum.textContent = g;
  const pct = Math.round(g / TOTAL_POINTS * 100);

  const finalNum = document.getElementById('finalScoreNum');
  if(finalNum){
    finalNum.textContent = g;
    const circumference = 415;
    const offset = circumference - (pct/100)*circumference;
    document.getElementById('finalFg').style.strokeDashoffset = offset;
    const msg = document.getElementById('finalMsg');
    if(g === TOTAL_POINTS) msg.textContent = "🏆 Bravo ! Badge « Expert OneNote » débloqué.";
    else if(pct >= 80) msg.textContent = "Presque parfait, quelques étapes à finaliser.";
    else if(pct >= 40) msg.textContent = "Belle progression, continuez !";
    else msg.textContent = "Revenez en arrière pour compléter les étapes manquantes.";
  }
  renderSynthesis();
}

function goTo(idx){
  idx = Math.max(0, Math.min(slides.length - 1, idx));
  slideEls[current].classList.remove('active');
  current = idx;
  const el = slideEls[current];
  el.classList.add('active');
  wireQuestionSlide(current);

  const accent = getComputedStyle(el).getPropertyValue('--accent') || 'var(--purple)';
  document.documentElement.style.setProperty('--accent', accent);
  topFill.style.width = ((current) / (slides.length - 1) * 100) + '%';
  topFill.style.background = accent;
  const chipEl = document.getElementById('scoreChip');
  chipEl.style.setProperty('--accent', accent);
  chipEl.classList.toggle('show', slides[current].type === 'final');

  navFrac.textContent = (current + 1) + ' / ' + slides.length;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === slides.length - 1;

  updateScore();
  if(menuOverlay.classList.contains('open')) renderMenu();
}

/* ============== menu "toutes les étapes" ============== */
const menuOverlay = document.getElementById('menuOverlay');
const menuList = document.getElementById('menuList');
const menuBtn = document.getElementById('menuBtn');
const menuClose = document.getElementById('menuClose');

function renderMenu(){
  let html = '';
  MISSIONS.forEach((m, mi) => {
    const missionSlideIdx = slides.findIndex(s => s.type === 'mission' && s.mi === mi);
    const total = m.items.length;
    const earned = m.items.reduce((a,i,ii)=>a+(state[mi][ii]?1:0),0);
    html += `<div class="menu-mission" style="--mstep-color:${m.color}">
      <div class="menu-mission-head" style="background:${m.color}">
        <span>Mission ${mi+1} · ${m.title}</span>
        <span class="menu-mission-pts">${earned} / ${total} étapes</span>
      </div>
      <div class="menu-step ${current===missionSlideIdx?'current':''}" data-goto="${missionSlideIdx}">
        <div class="num">${mi+1}</div>
        <div class="lbl">Introduction de la mission</div>
      </div>`;
    m.items.forEach((item, ii) => {
      const slideIdx = slides.findIndex(s => s.type === 'question' && s.mi === mi && s.ii === ii);
      const done = state[mi][ii];
      const locked = revealed[mi][ii];
      html += `<div class="menu-step ${done?'done':''} ${current===slideIdx?'current':''}" data-goto="${slideIdx}">
        <div class="num">${done ? '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>' : (ii+1)}</div>
        <div class="lbl">${item.t}</div>
        ${locked ? `<span class="lock">${status[mi][ii]==='lost' ? '🔴' : '🟠'}</span>` : ''}
        ${item.bonus ? '<span class="badge">BONUS</span>' : ''}
      </div>`;
    });
    html += `</div>`;
  });
  menuList.innerHTML = html;

  menuList.querySelectorAll('.menu-step[data-goto]').forEach(row => {
    row.addEventListener('click', () => {
      goTo(parseInt(row.dataset.goto, 10));
      closeMenu();
    });
  });
}

function openMenu(){ renderMenu(); menuOverlay.classList.add('open'); }
function closeMenu(){ menuOverlay.classList.remove('open'); }

menuBtn.addEventListener('click', openMenu);
menuClose.addEventListener('click', closeMenu);
menuOverlay.addEventListener('click', (e) => { if(e.target === menuOverlay) closeMenu(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeMenu(); });

prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => tryAdvance());

function validateIdentity(){
  if(slides[current].type !== 'identity') return true;
  const f = document.getElementById('idFirst');
  const l = document.getElementById('idLast');
  const err = document.getElementById('idError');
  participantFirst = f.value.trim();
  participantLast = l.value.trim();
  const ok = participantFirst && participantLast;
  if(err) err.style.display = ok ? 'none' : 'block';
  if(!ok) (participantFirst ? l : f).focus();
  return ok;
}

function tryAdvance(){
  if(!validateIdentity()) return;
  goTo(current + 1);
}

document.addEventListener('input', (e) => {
  if(e.target && (e.target.id === 'idFirst' || e.target.id === 'idLast')){
    participantFirst = document.getElementById('idFirst').value.trim();
    participantLast = document.getElementById('idLast').value.trim();
  }
});

document.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA'){
    if(e.key === 'Enter') tryAdvance();
    return;
  }
  if(e.key === 'ArrowRight') tryAdvance();
  if(e.key === 'ArrowLeft') goTo(current - 1);
});

document.addEventListener('click', (e) => {
  if(e.target && e.target.id === 'restartBtn') goTo(0);
  if(e.target && e.target.closest && e.target.closest('#dlSynthesis')) downloadSynthesis();
});

const scoreTotalLbl = document.getElementById('scoreTotalLbl');
if(scoreTotalLbl) scoreTotalLbl.textContent = TOTAL_POINTS;

goTo(0);
</script>
</body>
